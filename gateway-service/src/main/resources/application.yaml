server:
  port: 8080

spring:
  application:
    name: gateway-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
cloud:
  gateway:
    routes:
      - id: product-service
        uri: lb://PRODUCT-SERVICE
        predicates:
          - Path=/api/v1/products/**
